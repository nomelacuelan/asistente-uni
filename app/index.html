<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Asistente Uni</title>
  <meta name="description" content="Tu asistente de la universidad: exámenes, prácticas, recordatorios y chat con IA.">
  <meta name="theme-color" content="#0f6b53">
  <script>
    // Aplica el tema elegido antes de pintar la página (evita un parpadeo)
    try { const t = localStorage.getItem('tema'); if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.tema = t; } catch {}
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Asistente Uni">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="barra-superior">
    <h1 id="titulo">Asistente Uni</h1>
  </header>

  <main id="contenido" aria-live="polite"></main>

  <nav class="pestanas" aria-label="Secciones">
    <a href="#hoy" data-pestana="hoy"><span class="ico">🏠</span><span>Hoy</span><b class="globo" id="globo-hoy" hidden></b></a>
    <a href="#horario" data-pestana="horario"><span class="ico">🗓️</span><span>Horario</span></a>
    <a href="#chat" data-pestana="chat"><span class="ico">💬</span><span>Chat</span></a>
    <a href="#agenda" data-pestana="agenda"><span class="ico">📅</span><span>Agenda</span></a>
    <a href="#mas" data-pestana="mas"><span class="ico">☰</span><span>Más</span></a>
  </nav>

  <div id="hoja-fondo" class="hoja-fondo" hidden></div>
  <section id="hoja" class="hoja" role="dialog" aria-modal="true" hidden></section>
  <div id="aviso" class="aviso" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
